<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>unimetric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0c0e12; --panel:#14171d; --panel2:#1a1e26; --hover:#20252e;
    --line:#262c36; --line2:#323a46;
    --ink:#e8ebf2; --muted:#8a94a6; --faint:#5d6675;
    --accent:#f5a524; --accent-dim:#3a2f17; --green:#3ddc97; --red:#ff6b6b; --blue:#54a0ff;
    --disp:'Bricolage Grotesque',sans-serif;
    --sans:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --side:236px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;
       background-image:radial-gradient(1200px 600px at 80% -10%,rgba(245,165,36,.06),transparent 60%);}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  ::selection{background:var(--accent);color:#1a1205}
  /* scrollbars */
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
  *::-webkit-scrollbar-track{background:transparent}

  .app{display:grid;grid-template-columns:var(--side) 1fr;height:100vh}

  /* ---------- Sidebar (Jira-like) ---------- */
  .side{background:linear-gradient(180deg,#0f1217,#0c0e12);border-right:1px solid var(--line);
        display:flex;flex-direction:column;min-height:0}
  .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
  .brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);
        display:grid;place-items:center;color:#1a1205;font-weight:700;font-family:var(--disp);
        box-shadow:0 0 0 1px rgba(245,165,36,.5),0 6px 18px -6px rgba(245,165,36,.5)}
  .brand b{font-family:var(--disp);font-size:18px;letter-spacing:.2px}
  .brand .dot{color:var(--accent)}

  .orgbox{padding:6px 12px 12px;border-bottom:1px solid var(--line)}
  .orglabel{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
        padding:0 6px 6px}
  .orgswitch{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:9px;
        background:var(--panel);border:1px solid var(--line);color:var(--ink);text-align:left}
  .orgswitch:hover{background:var(--hover);border-color:var(--line2)}
  .orgswitch .av{width:24px;height:24px;border-radius:6px;background:var(--accent-dim);
        color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
  .orgswitch .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .orgswitch .cv{color:var(--faint)}
  .orgmenu{margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:9px;
        overflow:hidden;display:none}
  .orgmenu.show{display:block}
  .orgmenu button{display:flex;gap:8px;align-items:center;width:100%;padding:8px 10px;background:none;
        border:0;color:var(--ink);text-align:left;font-size:13px}
  .orgmenu button:hover{background:var(--hover)}
  .orgmenu .new{color:var(--accent);border-top:1px solid var(--line)}
  .badge{font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
  .badge.live{color:var(--green);border-color:rgba(61,220,151,.4)}

  nav{padding:10px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
  nav .sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
        padding:12px 8px 6px}
  nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--muted);
        text-decoration:none;font-weight:500;border:1px solid transparent}
  nav a svg{width:17px;height:17px;flex:none}
  nav a:hover{background:var(--hover);color:var(--ink)}
  nav a.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(245,165,36,.25)}
  .side .foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);
        font-size:11px;color:var(--faint);font-family:var(--mono)}

  /* ---------- Main ---------- */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .topbar{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;
        gap:12px;padding:0 22px;background:rgba(12,14,18,.7);backdrop-filter:blur(8px)}
  .crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:600}
  .crumb .sep{color:var(--faint)}
  .topbar .sp{flex:1}
  .content{flex:1;overflow-y:auto;padding:24px 26px 60px}
  .viewhead{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px}
  .viewhead h1{font-family:var(--disp);font-size:26px;margin:0;font-weight:700;letter-spacing:.2px}
  .viewhead p{margin:0;color:var(--muted);font-size:13px}

  /* buttons */
  .btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);padding:8px 13px;
        border-radius:8px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:var(--hover);border-color:#3f4856}
  .btn.pri{background:var(--accent);color:#1a1205;border-color:var(--accent)}
  .btn.pri:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{padding:5px 9px;font-size:12px}
  .iconbtn{background:none;border:0;color:var(--muted);padding:4px 7px;border-radius:6px;font-size:13px;cursor:pointer}
  .iconbtn:hover{background:var(--hover);color:var(--ink)}
  .vizbar{display:inline-flex;gap:2px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:3px;margin-top:12px}
  .vizbtn{background:none;border:0;color:var(--muted);padding:5px 13px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
  .vizbtn.active{background:var(--accent);color:#1a1205}
  .vizbtn:hover:not(.active){color:var(--ink)}
  /* 도넛 + 범례 */
  .donutwrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .donutcanvas{position:relative;width:240px;height:240px;flex:none}
  .donutcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
               justify-content:center;pointer-events:none}
  .donutcenter .dc-l{font-size:11px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase}
  .donutcenter b{font-family:var(--disp);font-size:23px;line-height:1.1;margin-top:2px}
  .donutlegend{flex:1;min-width:240px;display:flex;flex-direction:column;gap:1px}
  .legrow{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;cursor:default}
  .legrow:hover{background:var(--hover)}
  .legrow .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .legrow .llabel{flex:1;color:var(--ink);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .legrow .lval{color:var(--muted);font-family:var(--mono);font-size:12px}
  .legrow .lpct{width:66px;text-align:right;font-weight:700;font-family:var(--mono);font-size:13px}

  /* inputs */
  .in{background:var(--bg);border:1px solid var(--line2);color:var(--ink);padding:9px 11px;
        border-radius:8px;font-size:13px;width:100%}
  .in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
  label.fl{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:500}
  .mono{font-family:var(--mono)}

  /* ---------- Grafana-style panels ---------- */
  .grid{display:grid;gap:16px}
  .grid.kpi{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .panel{background:linear-gradient(180deg,var(--panel),#111419);border:1px solid var(--line);
        border-radius:12px;overflow:hidden}
  .panel>.ph{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);
        font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
  .panel>.ph .gr{flex:1}
  .panel>.pb{padding:16px}
  .kpicard .val{font-family:var(--disp);font-size:34px;font-weight:700;line-height:1;letter-spacing:.5px}
  .kpicard .sub{color:var(--faint);font-size:12px;margin-top:7px;font-family:var(--mono)}
  .kpicard .cert{color:var(--accent)}

  table.dt{border-collapse:collapse;width:100%;font-size:13px;font-family:var(--mono)}
  table.dt th,table.dt td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--line)}
  table.dt th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
  table.dt tr:hover td{background:rgba(255,255,255,.025)}
  table.dt th.num,table.dt td.num{text-align:right}
  table.dt td.num{position:relative}
  table.dt td.num .cellbar{position:absolute;top:4px;bottom:4px;right:0;background:rgba(245,165,36,.18);border-radius:4px;z-index:0}
  table.dt td.num .cellv{position:relative;z-index:1}
  .tablewrap{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:380px}
  .tablecap{font-size:11px;color:var(--faint);font-family:var(--mono);margin:8px 2px 0}
  pre.sql{background:#0a0c10;border:1px solid var(--line);color:#cfe3ff;padding:12px 14px;border-radius:9px;
        font-family:var(--mono);font-size:12.5px;overflow-x:auto;white-space:pre-wrap;margin:0}

  .empty{color:var(--muted);text-align:center;padding:48px 20px}
  .empty .big{font-family:var(--disp);font-size:18px;color:var(--ink);margin-bottom:6px}
  .err{color:var(--red);font-size:13px}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .hide{display:none!important}

  /* metric list */
  .mlist{display:flex;flex-direction:column;gap:8px}
  .mitem{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--line);
        border-radius:10px;background:var(--panel);cursor:pointer}
  .mitem:hover{border-color:var(--line2);background:var(--panel2)}
  .mitem.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .mitem .ic{width:30px;height:30px;border-radius:8px;background:var(--accent-dim);color:var(--accent);
        display:grid;place-items:center;flex:none}
  .mitem .nm{font-weight:600} .mitem .ds{font-size:12px;color:var(--muted)}
  .pill{font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);color:var(--muted)}
  .pill.simple{color:var(--blue)} .pill.ratio{color:var(--green)}

  /* ---------- Chat ---------- */
  .chatgrid{display:grid;grid-template-columns:230px 1fr;gap:16px;height:calc(100vh - 54px - 40px)}
  .chatside{border-right:1px solid var(--line);padding-right:14px;display:flex;flex-direction:column;min-height:0}
  .sesslist{margin-top:10px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;min-height:0}
  .sessitem{padding:8px 10px;border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer;
            border:1px solid transparent;display:flex;gap:6px;align-items:center}
  .sessitem:hover{background:var(--hover);color:var(--ink)}
  .sessitem.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(245,165,36,.25)}
  .sessitem .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sessitem .x{opacity:.5} .sessitem .x:hover{opacity:1;color:var(--red)}
  .chatwrap{display:flex;flex-direction:column;height:100%;min-height:0}
  .thread{flex:1;overflow-y:auto;padding:8px 2px 18px;display:flex;flex-direction:column;gap:16px}
  .msg{display:flex;gap:12px;max-width:860px}
  .msg .ava{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .msg.user .ava{background:var(--line2);color:var(--ink)}
  .msg.ai .ava{background:var(--accent);color:#1a1205}
  .bubble{padding:12px 15px;border-radius:13px;line-height:1.55;white-space:pre-wrap}
  .msg.ai .bubble{background:var(--panel);border:1px solid var(--line);border-top-left-radius:4px}
  .msg.user .bubble{background:var(--accent-dim);border:1px solid rgba(245,165,36,.3);border-top-right-radius:4px}
  .proposal{margin-top:10px;background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:14px}
  .proposal .pt{font-family:var(--disp);font-size:15px;margin-bottom:4px}
  .proposal .kv{font-size:12.5px;color:var(--muted);margin:3px 0}
  .proposal .kv code{font-family:var(--mono);color:var(--ink)}
  .composer{border-top:1px solid var(--line);padding:14px 0 4px;display:flex;gap:10px;align-items:flex-end}
  .composer textarea{flex:1;resize:none;min-height:46px;max-height:160px;background:var(--panel);
        border:1px solid var(--line2);border-radius:11px;color:var(--ink);padding:13px 14px;font-size:14px}
  .composer textarea:focus{outline:none;border-color:var(--accent)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .chip{font-size:12px;padding:6px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);color:var(--muted)}
  .chip:hover{color:var(--ink);border-color:var(--accent)}
  .typing{display:inline-flex;gap:4px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(6,7,10,.66);backdrop-filter:blur(3px);
        display:none;align-items:center;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:520px;
        max-width:94vw;max-height:92vh;overflow-y:auto;box-shadow:0 30px 80px -20px #000}
  .modal .mh{padding:20px 22px 4px}
  .modal .mh h2{font-family:var(--disp);font-size:20px;margin:0}
  .modal .mh p{color:var(--muted);font-size:13px;margin:6px 0 0}
  .modal .mb{padding:16px 22px}
  .modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .field{margin-bottom:13px}
  .seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .seg label{display:block;border:1px solid var(--line2);border-radius:10px;padding:11px;cursor:pointer;text-align:center;font-size:13px;color:var(--muted)}
  .seg input{display:none}
  .seg input:checked+span{color:var(--accent)}
  .seg label:has(input:checked){border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tlist{max-height:170px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;padding:8px;margin-top:8px}
  .tlist label{display:block;font-size:13px;padding:3px 4px;font-family:var(--mono)}
  .prog{font-family:var(--mono);font-size:12px}
  .prog .ok{color:var(--green)} .prog .bad{color:var(--red)}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line2);border-top-color:var(--accent);
        border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <!-- ================= Sidebar ================= -->
  <aside class="side">
    <div class="brand"><span class="mark">U</span><b>uni<span class="dot">·</span>metric</b></div>
    <div class="orgbox">
      <div class="orglabel">단체</div>
      <button class="orgswitch" id="orgSwitch">
        <span class="av" id="orgAv">–</span>
        <span class="nm" id="orgNm">단체 없음</span>
        <span class="cv">▾</span>
      </button>
      <div class="orgmenu" id="orgMenu"></div>
    </div>
    <nav id="nav">
      <div class="sec">작업 공간</div>
      <a data-view="overview" class="active">${''}</a>
    </nav>
    <div class="foot">unimetric · semantic layer</div>
  </aside>

  <!-- ================= Main ================= -->
  <div class="main">
    <div class="topbar">
      <div class="crumb"><b id="cbOrg">—</b><span class="sep">/</span><span id="cbView">개요</span>
        <span class="badge" id="cbMode"></span></div>
      <div class="sp"></div>
      <button class="btn sm" id="refreshBtn">↻ 새로고침</button>
      <button class="btn pri sm" id="navChatBtn">＋ AI로 지표 만들기</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- ================= New Org Modal ================= -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mh"><h2>새 단체</h2><p>회사·동아리·팀 등 데이터를 모아 지표를 보는 단위입니다.</p></div>
    <div class="mb">
      <div class="grid2 field">
        <div><label class="fl">단체 키</label><input class="in" id="np_key" placeholder="my_team"></div>
        <div><label class="fl">이름</label><input class="in" id="np_name" placeholder="우리 팀"></div>
      </div>
      <div class="field">
        <label class="fl">데이터 소스</label>
        <div class="seg" id="np_seg">
          <label><input type="radio" name="src" value="live" checked><span>🔌 라이브 연결</span></label>
          <label><input type="radio" name="src" value="copy"><span>📦 전체 복사</span></label>
          <label><input type="radio" name="src" value="file"><span>📄 파일</span></label>
        </div>
        <p class="muted" id="np_hint" style="font-size:12px;margin:8px 2px 0"></p>
      </div>
      <div id="dbFields">
        <div class="grid2 field">
          <div><label class="fl">종류</label>
            <select class="in" id="db_kind"><option value="postgres">PostgreSQL</option>
              <option value="mysql">MySQL</option><option value="sqlite">SQLite(경로)</option></select></div>
          <div><label class="fl">Database</label><input class="in" id="db_database" placeholder="dbname / 경로"></div>
        </div>
        <div class="grid2 field" id="db_host4">
          <div><label class="fl">Host</label><input class="in" id="db_host" placeholder="localhost"></div>
          <div><label class="fl">Port</label><input class="in" id="db_port" placeholder="5432"></div>
          <div><label class="fl">User</label><input class="in" id="db_user"></div>
          <div><label class="fl">Password</label><input class="in" id="db_password" type="password"></div>
        </div>
        <div class="row"><button class="btn sm" id="testConn">연결 테스트</button>
          <span class="muted" id="testMsg" style="font-size:12px"></span></div>
        <div id="copyExtra" class="hide">
          <div class="row" style="margin-top:10px"><button class="btn sm" id="selAll">전체</button>
            <button class="btn sm" id="selNone">해제</button><span class="muted" id="tcount" style="font-size:12px"></span></div>
          <div class="tlist" id="tlist"></div>
        </div>
      </div>
      <div id="progBox" class="hide" style="margin-top:8px">
        <div class="prog" id="progStatus"></div>
        <div class="prog" id="progTables" style="max-height:180px;overflow:auto;margin-top:6px"></div>
      </div>
      <div class="err" id="npErr" style="margin-top:8px"></div>
    </div>
    <div class="mf">
      <button class="btn" id="cancelNp">취소</button>
      <button class="btn" id="retryNp" style="display:none">실패 재시도</button>
      <button class="btn pri" id="createNp">만들기</button>
    </div>
  </div>
</div>

<!-- ============ 지표 편집/생성 모달 ============ -->
<div class="overlay" id="edOverlay">
  <div class="modal">
    <div class="mh"><h2 id="edTitle">지표</h2><p>이 단체의 지표 카탈로그(전사 공유)에 저장됩니다.</p></div>
    <div class="mb">
      <div class="grid2 field">
        <div><label class="fl">이름</label><input class="in" id="ed_name" placeholder="metric_name"></div>
        <div><label class="fl">테이블</label><select class="in" id="ed_table"></select></div>
      </div>
      <div class="field"><label class="fl">설명</label><input class="in" id="ed_desc" placeholder="이 지표가 뜻하는 것"></div>
      <div class="field"><label class="fl">유형</label>
        <select class="in" id="ed_type"><option value="simple">단순 집계</option><option value="ratio">비율 (A / B)</option></select></div>
      <div id="ed_simple" class="field">
        <label class="fl">계산</label>
        <div class="row"><select class="in" id="ed_m_agg" style="flex:1"></select><select class="in" id="ed_m_expr" style="flex:1"></select></div>
      </div>
      <div id="ed_ratio" class="hide">
        <div class="field"><label class="fl">분자</label><div class="row"><select class="in" id="ed_n_agg" style="flex:1"></select><select class="in" id="ed_n_expr" style="flex:1"></select></div></div>
        <div class="field"><label class="fl">분모</label><div class="row"><select class="in" id="ed_d_agg" style="flex:1"></select><select class="in" id="ed_d_expr" style="flex:1"></select></div></div>
      </div>
      <div class="field"><label class="fl">조건(필터) — 선택</label><input class="in mono" id="ed_filter" placeholder="예: feedback_status = 'DONE'"></div>
      <div class="field"><label class="fl">차원(쪼개기) — 미리보기에서 group by</label><div id="ed_dims" class="muted"></div></div>
      <div class="row"><label style="font-size:13px"><input type="checkbox" id="ed_cert"> certified(인증)</label></div>
      <div id="ed_out" style="margin-top:10px"></div>
      <div class="err" id="ed_err" style="margin-top:6px"></div>
    </div>
    <div class="mf"><button class="btn" id="ed_cancel">취소</button>
      <button class="btn" id="ed_preview">미리보기</button>
      <button class="btn pri" id="ed_save">저장</button></div>
  </div>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function api(path,opts){const r=await fetch(path,opts);const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.detail||r.statusText);return b;}

let ORGS=[],ORG=null,ORGMODE='local',VIEW='overview',chart=null;
const ICONS={
  overview:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
  metrics:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>',
  data:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  define:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h10M4 17h7"/></svg>',
};
const NAV=[['overview','개요'],['metrics','지표'],['data','데이터 탐색'],['chat','AI 채팅'],['define','정의(YAML)']];

function buildNav(){
  const nav=$('#nav'); nav.innerHTML='<div class="sec">작업 공간</div>';
  for(const [v,label] of NAV){
    const a=el('a'); a.dataset.view=v; a.className=v===VIEW?'active':'';
    a.innerHTML=ICONS[v]+'<span>'+label+'</span>';
    a.onclick=()=>setView(v); nav.appendChild(a);
  }
}
function setView(v){VIEW=v;buildNav();$('#cbView').textContent=(NAV.find(x=>x[0]===v)||[])[1]||v;render();}

// ---------- orgs ----------
async function loadOrgs(){
  const {projects}=await api('/api/projects'); ORGS=projects;
  const menu=$('#orgMenu'); menu.innerHTML='';
  for(const o of ORGS){
    const row=el('div'); row.style.cssText='display:flex;align-items:center';
    const b=el('button'); b.style.flex='1';
    b.innerHTML='<span class="av" style="width:20px;height:20px;font-size:11px">'+esc(o.name[0]||'?')+'</span><span style="flex:1;text-align:left">'+esc(o.name)+'</span>'+(o.mode==='live'?'<span class="badge live">live</span>':'<span class="badge">copy</span>');
    b.onclick=()=>{setOrg(o.key);toggleMenu(false);};
    const del=el('button'); del.textContent='🗑'; del.title='단체 삭제'; del.style.cssText='flex:none;width:40px;color:var(--muted)';
    del.onclick=async(e)=>{e.stopPropagation(); if(!confirm('단체 “'+o.name+'”와 그 안의 모든 데이터·지표를 삭제할까요?'))return;
      try{await api('/api/projects/'+encodeURIComponent(o.key),{method:'DELETE'}); if(ORG===o.key)ORG=null; await loadOrgs();}catch(err){alert(err.message);}};
    row.append(b,del); menu.appendChild(row);
  }
  const nb=el('button','new','＋ 새 단체 만들기'); nb.onclick=()=>{openModal();toggleMenu(false);}; menu.appendChild(nb);
  if(ORGS.length){ if(!ORG||!ORGS.find(o=>o.key===ORG))ORG=ORGS[0].key; setOrg(ORG); }
  else { ORG=null; $('#orgNm').textContent='단체 없음'; $('#orgAv').textContent='–'; $('#cbOrg').textContent='—'; render(); }
}
function setOrg(key){
  ORG=key; const o=ORGS.find(x=>x.key===key); if(!o)return;
  CHAT=[]; SESSION=null;   // 단체 바뀌면 대화도 새로 시작
  ORGMODE=o.mode; $('#orgNm').textContent=o.name; $('#orgAv').textContent=(o.name[0]||'?');
  $('#cbOrg').textContent=o.name;
  $('#cbMode').textContent=o.mode==='live'?'라이브':'복사본'; $('#cbMode').className='badge'+(o.mode==='live'?' live':'');
  render();
}
function toggleMenu(f){$('#orgMenu').classList.toggle('show',f===undefined?undefined:f)}
$('#orgSwitch').onclick=()=>$('#orgMenu').classList.toggle('show');
$('#refreshBtn').onclick=()=>render();
$('#navChatBtn').onclick=()=>setView('chat');

// ---------- view router ----------
function render(){
  const c=$('#content'); if(chart){chart.destroy();chart=null;}
  if(!ORG){ c.innerHTML=''; c.appendChild(emptyState('단체를 먼저 만드세요','좌측 상단 단체 메뉴에서 데이터를 연결해 시작합니다.',true)); return; }
  if(VIEW==='overview')return renderOverview(c);
  if(VIEW==='metrics')return renderMetrics(c);
  if(VIEW==='data')return renderData(c);
  if(VIEW==='chat')return renderChat(c);
  if(VIEW==='define')return renderDefine(c);
}
function emptyState(big,sub,withBtn){
  const e=el('div','empty','<div class="big">'+esc(big)+'</div><div>'+esc(sub)+'</div>');
  if(withBtn){const b=el('button','btn pri','＋ 새 단체');b.style.marginTop='16px';b.onclick=openModal;e.appendChild(b);}
  return e;
}
function vhead(c,title,desc,actions){
  const h=el('div','viewhead'); h.innerHTML='<div><h1>'+esc(title)+'</h1>'+(desc?'<p>'+esc(desc)+'</p>':'')+'</div>';
  if(actions){const sp=el('div');sp.style.flex='1';h.appendChild(sp);actions.forEach(a=>h.appendChild(a));}
  c.appendChild(h);
}

// ---------- Overview: KPI panels ----------
async function renderOverview(c){
  c.innerHTML=''; vhead(c,'개요','이 단체의 인증 지표 현황');
  const {metrics}=await api('/api/metrics?project='+encodeURIComponent(ORG));
  if(!metrics.length){c.appendChild(emptyState('아직 지표가 없어요','‘AI 채팅’ 탭에서 대화로 첫 지표를 만들어 보세요.'));return;}
  const grid=el('div','grid kpi'); c.appendChild(grid);
  for(const m of metrics){
    const p=el('div','panel kpicard');
    p.innerHTML='<div class="ph"><span class="gr">'+esc(m.name)+'</span>'+(m.certified?'<span class="cert">✓</span>':'')+'</div><div class="pb"><div class="val">…</div><div class="sub">'+esc(m.type)+(m.description?' · '+esc(m.description):'')+'</div></div>';
    grid.appendChild(p);
    const ph=$('.ph',p);
    const edb=el('button','iconbtn','✏️');edb.title='수정';edb.onclick=()=>editMetric(m.name);
    const dlb=el('button','iconbtn','🗑');dlb.title='삭제';dlb.onclick=()=>deleteMetric(m.name);
    ph.append(edb,dlb);
    api('/api/metrics/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:ORG,metric:m.name})})
      .then(r=>{const v=r.rows[0]?Object.values(r.rows[0])[0]:'—';$('.val',p).textContent=fmt(v);})
      .catch(()=>{$('.val',p).textContent='—';$('.val',p).style.color='var(--faint)';});
  }
}

// ---------- Metrics: list + run panel ----------
let CUR_METRIC=null;
async function renderMetrics(c){
  c.innerHTML='';
  const nb=el('button','btn pri sm','＋ 새 지표'); nb.onclick=()=>openMetricEditor(null);
  vhead(c,'지표','정의된 지표를 조회·수정·삭제합니다',[nb]);
  const wrap=el('div'); wrap.style.cssText='display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start';
  const left=el('div','mlist'), right=el('div'); wrap.append(left,right); c.appendChild(wrap);
  const {metrics}=await api('/api/metrics?project='+encodeURIComponent(ORG));
  if(!metrics.length){left.appendChild(emptyState('지표 없음','‘＋ 새 지표’ 또는 AI 채팅으로 만들기'));return;}
  metrics.forEach((m,i)=>{
    const it=el('div','mitem');
    it.innerHTML='<div class="ic">Σ</div><div style="flex:1;min-width:0"><div class="nm">'+esc(m.name)+'</div><div class="ds">'+esc(m.description||m.entity)+'</div></div><span class="pill '+m.type+'">'+m.type+'</span>'+(m.certified?'<span class="cert" style="color:var(--accent)">✓</span>':'');
    const acts=el('div'); acts.style.cssText='display:flex;gap:1px;flex:none';
    const ed=el('button','iconbtn','✏️'); ed.title='수정'; ed.onclick=(e)=>{e.stopPropagation();editMetric(m.name);};
    const dl=el('button','iconbtn','🗑'); dl.title='삭제'; dl.onclick=(e)=>{e.stopPropagation();deleteMetric(m.name);};
    acts.append(ed,dl); it.appendChild(acts);
    it.onclick=()=>{[...left.children].forEach(x=>x.classList.remove('active'));it.classList.add('active');openRun(right,m);};
    left.appendChild(it); if(i===0)it.classList.add('active');
  });
  openRun(right,metrics[0]);
}
// 지표 수정: 상세 명세를 불러와 편집 모달을 연다.
async function editMetric(name){try{const {spec}=await api('/api/metrics/detail?project='+encodeURIComponent(ORG)+'&metric='+encodeURIComponent(name));openMetricEditor(spec);}catch(e){alert(e.message);}}
// 지표 삭제.
async function deleteMetric(name){if(!confirm('지표 “'+name+'”를 삭제할까요?'))return;try{await api('/api/metrics?project='+encodeURIComponent(ORG)+'&metric='+encodeURIComponent(name),{method:'DELETE'});render();}catch(e){alert(e.message);}}
function openRun(right,m){
  CUR_METRIC=m;
  right.innerHTML='';
  const p=el('div','panel');
  p.innerHTML='<div class="ph"><span class="gr">'+esc(m.name)+'</span><span class="pill '+m.type+'">'+m.type+'</span></div>';
  const pb=el('div','pb');
  pb.innerHTML='<div class="row" style="margin-bottom:12px"><input class="in" id="gb" placeholder="그룹 기준(차원) — 예: feedback_status" style="flex:1"><button class="btn pri" id="runBtn">실행 ▸</button></div><div id="runOut"></div>';
  p.appendChild(pb); right.appendChild(p);
  $('#runBtn',pb).onclick=async()=>{
    const gb=$('#gb',pb).value.split(',').map(s=>s.trim()).filter(Boolean);
    $('#runOut',pb).innerHTML='<span class="muted">실행 중…</span>';
    try{const r=await api('/api/metrics/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:ORG,metric:m.name,group_by:gb})});
      renderResult($('#runOut',pb),r);}catch(e){$('#runOut',pb).innerHTML='<span class="err">'+esc(e.message)+'</span>';}
  };
  $('#runBtn',pb).click();
}

// ---------- Data explorer ----------
async function renderData(c){
  c.innerHTML=''; vhead(c,'데이터 탐색','소스 테이블을 직접 들여다봅니다 (복사 없이 라이브 조회)');
  const wrap=el('div'); wrap.style.cssText='display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start';
  const left=el('div','mlist'),right=el('div'); wrap.append(left,right); c.appendChild(wrap);
  const {tables}=await api('/api/tables?project='+encodeURIComponent(ORG));
  if(!tables.length){left.appendChild(emptyState('테이블 없음',''));return;}
  tables.forEach((t,i)=>{const it=el('div','mitem');it.innerHTML='<div class="ic">▦</div><div class="nm">'+esc(t)+'</div>';
    it.onclick=()=>{[...left.children].forEach(x=>x.classList.remove('active'));it.classList.add('active');showTable(right,t);};
    left.appendChild(it);if(i===0)it.classList.add('active');});
  showTable(right,tables[0]);
}
async function showTable(right,t){
  right.innerHTML='';const p=el('div','panel');p.innerHTML='<div class="ph"><span class="gr">'+esc(t)+'</span><span class="faint">미리보기 200행</span></div>';
  const pb=el('div','pb');pb.style.overflowX='auto';pb.innerHTML='<span class="muted">불러오는 중…</span>';p.appendChild(pb);right.appendChild(p);
  try{const r=await api('/api/preview?project='+encodeURIComponent(ORG)+'&table='+encodeURIComponent(t));pb.innerHTML='';pb.appendChild(buildTable(r.rows));}
  catch(e){pb.innerHTML='<span class="err">'+esc(e.message)+'</span>';}
}

// ---------- Chat (the star) ----------
let CHAT=[], SESSION=null;
function newChat(){CHAT=[];SESSION=null;renderChat($('#content'));}
function renderChat(c){
  c.innerHTML='';
  const grid=el('div','chatgrid');
  // 왼쪽: 세션 목록 (ChatGPT/Claude식)
  const side=el('div','chatside');
  const nc=el('button','btn pri sm','＋ 새 대화');nc.style.width='100%';nc.onclick=newChat;
  const slist=el('div','sesslist');slist.id='sessList';
  side.append(nc,slist);
  // 오른쪽: 대화
  const wrap=el('div','chatwrap');
  const thread=el('div','thread');thread.id='thread';
  const chips=el('div','chips');
  ['답변을 상태별로 세줘','이씨 성을 가진 직원 수','사용자당 평균 답변 수','월별 거래 추이 지표'].forEach(t=>{
    const ch=el('button','chip',t);ch.onclick=()=>{$('#cin').value=t;send();};chips.appendChild(ch);});
  const comp=el('div','composer');
  comp.innerHTML='<textarea id="cin" placeholder="예) ‘게시글 등록 수’ 지표 만들어줘 (삭제분 제외)"></textarea><button class="btn pri" id="csend" style="height:46px">보내기</button>';
  wrap.append(thread,chips,comp);
  grid.append(side,wrap);c.appendChild(grid);
  if(!CHAT.length){addMsg('ai','안녕하세요! 이 단체의 데이터로 무엇이 궁금하세요? 질문하면 관련 테이블을 찾아 답하고, 지표로 저장할 수 있어요.');}
  else CHAT.forEach(m=>renderMsg(thread,m));
  $('#csend',comp).onclick=send;
  $('#cin',comp).addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
  loadSessions();
  thread.scrollTop=thread.scrollHeight;
}
// 현재 단체의 세션 목록을 불러와 사이드바에 그린다.
async function loadSessions(){
  const box=$('#sessList');if(!box||!ORG)return;
  try{
    const {sessions}=await api('/api/chat/sessions?project='+encodeURIComponent(ORG));
    box.innerHTML='';
    sessions.forEach(s=>{
      const it=el('div','sessitem'+(s.id===SESSION?' active':''));
      const title=(s.title||'새 대화').slice(0,40);
      it.innerHTML='<span class="t">'+esc(title)+'</span><span class="x">×</span>';
      it.querySelector('.t').onclick=()=>openSession(s.id);
      it.querySelector('.x').onclick=async(e)=>{e.stopPropagation();await api('/api/chat/session/'+s.id,{method:'DELETE'});if(s.id===SESSION){CHAT=[];SESSION=null;}renderChat($('#content'));};
      box.appendChild(it);
    });
  }catch(e){/* 세션 목록 실패는 조용히 무시 */}
}
// 세션을 골라 그 대화를 불러온다.
async function openSession(id){
  try{
    const {messages}=await api('/api/chat/session/'+id);
    SESSION=id;
    CHAT=messages.map(m=>({role:m.role==='assistant'?'ai':'user',
      content:(m.content||'').replace(/\n\[(제안 지표|실행 SQL|되물음):[\s\S]*$/,'')}));
    renderChat($('#content'));
  }catch(e){alert(e.message);}
}
function addMsg(role,content,extra){const m={role,content,extra};CHAT.push(m);const th=$('#thread');if(th){renderMsg(th,m);th.scrollTop=th.scrollHeight;}return m;}
function renderMsg(th,m){
  const d=el('div','msg '+(m.role==='user'?'user':'ai'));
  d.innerHTML='<div class="ava">'+(m.role==='user'?'나':'AI')+'</div>';
  const body=el('div');body.style.maxWidth='820px';
  body.appendChild(el('div','bubble',esc(m.content)));
  if(m.extra)renderExtra(body,m.extra);
  d.appendChild(body);th.appendChild(d);
}
// AI 응답의 부가물(선택지 / 지표제안+결과 / 분석SQL+결과)을 렌더.
function renderExtra(body,ex){
  // ① 정보 부족 → 선택지 버튼
  if(ex.clarify){
    const box=el('div','proposal');
    box.innerHTML='<div class="kv">'+esc(ex.clarify.question||'')+'</div>';
    const row=el('div','chips');row.style.marginTop='8px';
    (ex.clarify.options||[]).forEach(opt=>{const b=el('button','chip',esc(opt));b.onclick=()=>sendText(opt);row.appendChild(b);});
    box.appendChild(row);body.appendChild(box);
  }
  // ② 지표 제안(+자동 실행 결과)
  if(ex.spec){
    body.appendChild(proposalCard(ex.spec));
    if(ex.result){const o=el('div');o.style.marginTop='8px';renderResult(o,ex.result);body.appendChild(o);}
    else if(ex.result_error){body.appendChild(el('div','err','결과 실행 실패: '+esc(ex.result_error)));}
  }
  // ③ 분석 답변(조인 등) — SQL + 결과 + "지표로 저장"(자유 SQL 지표)
  if(ex.answer){
    const o=el('div','proposal');o.innerHTML='<div class="pt">📊 분석 결과</div>';
    const r=el('div');renderResult(r,ex.answer);o.appendChild(r);
    const row=el('div','row');row.style.marginTop='10px';
    const sv=el('button','btn pri sm','이 결과를 지표로 저장');
    const msg=el('span','muted');msg.style.marginLeft='8px';
    sv.onclick=async()=>{
      const name=prompt('지표 이름(영문/숫자/밑줄):','');
      if(!name)return;
      try{
        await api('/api/builder/save',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({project:ORG,spec:{type:'sql',name:name.trim(),sql:ex.answer.sql,description:''}})});
        sv.textContent='저장됨 ✓';sv.disabled=true;
      }catch(e){msg.innerHTML='<span class="err">'+esc(e.message)+'</span>';}
    };
    row.append(sv,msg);o.append(row);body.appendChild(o);
  } else if(ex.answer_error){body.appendChild(el('div','err','쿼리 실행 실패: '+esc(ex.answer_error)));}
}
function proposalCard(spec){
  const calc=spec.type==='ratio'?`${spec.numerator?.agg}(${spec.numerator?.expr}) / ${spec.denominator?.agg}(${spec.denominator?.expr})`:`${spec.measure?.agg}(${spec.measure?.expr})`;
  const card=el('div','proposal');
  card.innerHTML='<div class="pt">📐 '+esc(spec.name||'(이름 없음)')+'</div>'+
    '<div class="kv">테이블 <code>'+esc(spec.table)+'</code> · 계산 <code>'+esc(calc)+'</code></div>'+
    (spec.filter?'<div class="kv">조건 <code>'+esc(spec.filter)+'</code></div>':'')+
    (spec.dimensions&&spec.dimensions.length?'<div class="kv">차원 <code>'+esc(spec.dimensions.join(', '))+'</code></div>':'')+
    (spec.description?'<div class="kv">'+esc(spec.description)+'</div>':'');
  const row=el('div','row');row.style.marginTop='10px';
  const sv=el('button','btn pri sm','지표로 저장');

// ---------- shared: result table + chart ----------
function fmt(v){if(v==null)return'';if(typeof v==='number')return Number.isInteger(v)?v.toLocaleString():v.toFixed(2);return String(v);}
function buildTable(rows){
  if(!rows||!rows.length){return el('div','muted','결과 행이 없습니다.');}
  const cols=Object.keys(rows[0]);
  // 모든 비-null 값이 숫자인 컬럼 = 숫자 컬럼(우측정렬 + 셀 내 비율 바)
  const numCols=cols.filter(c=>rows.every(r=>r[c]==null||typeof r[c]==='number'));
  const max={};numCols.forEach(c=>{max[c]=Math.max(1,...rows.map(r=>Math.abs(Number(r[c])||0)));});
  const t=el('table','dt');
  const head='<thead><tr>'+cols.map(c=>'<th class="'+(numCols.includes(c)?'num':'')+'">'+esc(c)+'</th>').join('')+'</tr></thead>';
  const body='<tbody>'+rows.map(r=>'<tr>'+cols.map(c=>{
    if(numCols.includes(c)){
      const v=Number(r[c])||0, w=Math.round(Math.abs(v)/max[c]*100);
      return '<td class="num"><span class="cellbar" style="width:'+w+'%"></span><span class="cellv">'+esc(fmt(r[c]))+'</span></td>';
    }
    return '<td>'+esc(fmt(r[c]))+'</td>';
  }).join('')+'</tr>').join('')+'</tbody>';
  t.innerHTML=head+body;return t;
}
const PIE_COLORS=['#f5a524','#54a0ff','#3ddc97','#ff6b6b','#f472b6','#a78bfa','#fbbf24','#22d3ee','#fb923c','#34d399','#60a5fa','#a3e635'];
// 막대 끝에 값 라벨을 그리는 인라인 플러그인(가로 막대 기준).
const barValueLabel={id:'barValueLabel',afterDatasetsDraw(chart){
  const ds=chart.data.datasets[0], meta=chart.getDatasetMeta(0), ctx=chart.ctx;
  ctx.save();ctx.font='600 11px ui-monospace, monospace';ctx.fillStyle='#cfd5df';
  ctx.textAlign='left';ctx.textBaseline='middle';
  meta.data.forEach((b,i)=>{ctx.fillText(fmt(ds.data[i]), b.x+8, b.y);});
  ctx.restore();
}};
// 가로 막대: 값 내림차순 + 카테고리 색 + 막대 끝 값 라벨.
function drawBar(node,labels,data){
  const order=labels.map((_,i)=>i).sort((a,b)=>data[b]-data[a]);
  const L=order.map(i=>labels[i]), D=order.map(i=>data[i]);
  const C=order.map((_,j)=>PIE_COLORS[j%PIE_COLORS.length]);
  const cv=el('canvas');
  const h=Math.min(560, Math.max(180, L.length*40+30));
  cv.style.maxHeight=h+'px';node.appendChild(cv);
  return new Chart(cv,{type:'bar',
    data:{labels:L,datasets:[{data:D,backgroundColor:C,borderRadius:6,maxBarThickness:30}]},
    options:{indexAxis:'y',layout:{padding:{right:56}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+fmt(c.parsed.x)}}},
      scales:{x:{ticks:{color:'#8a94a6'},grid:{color:'#1a1e26'},border:{display:false}},
              y:{ticks:{color:'#cfd5df',font:{size:12}},grid:{display:false},border:{display:false}}}},
    plugins:[barValueLabel]});
}
// 도넛 차트 + 우측 범례(색·라벨·값·퍼센트, 값 내림차순). 범례 hover 시 해당 조각 강조.
function drawDonut(node,labels,data){
  const total=data.reduce((a,b)=>a+(b||0),0);
  const colors=labels.map((_,i)=>PIE_COLORS[i%PIE_COLORS.length]);
  const wrap=el('div','donutwrap');
  const cwrap=el('div','donutcanvas');
  const cv=el('canvas');cwrap.appendChild(cv);
  const center=el('div','donutcenter');
  center.innerHTML='<span class="dc-l">합계</span><b>'+fmt(total)+'</b>';
  cwrap.appendChild(center);
  const leg=el('div','donutlegend');
  let inst=null;
  // 값 내림차순으로 범례 정렬(원래 인덱스 i는 조각 강조용 보존)
  labels.map((l,i)=>({l,v:data[i],c:colors[i],i})).sort((a,b)=>b.v-a.v).forEach(it=>{
    const pct=total?(it.v/total*100):0;
    const row=el('div','legrow');
    row.innerHTML='<span class="dot" style="background:'+it.c+'"></span>'+
      '<span class="llabel">'+esc(it.l)+'</span>'+
      '<span class="lval">'+fmt(it.v)+'</span>'+
      '<span class="lpct" style="color:'+it.c+'">'+pct.toFixed(2)+'%</span>';
    row.onmouseenter=()=>{if(inst){inst.setActiveElements([{datasetIndex:0,index:it.i}]);inst.update();}};
    row.onmouseleave=()=>{if(inst){inst.setActiveElements([]);inst.update();}};
    leg.appendChild(row);
  });
  wrap.append(cwrap,leg);node.appendChild(wrap);
  inst=new Chart(cv,{type:'doughnut',
    data:{labels,datasets:[{data,backgroundColor:colors,borderColor:'#14171d',borderWidth:2,hoverOffset:7}]},
    options:{cutout:'64%',plugins:{legend:{display:false},
      tooltip:{callbacks:{label:(ctx)=>' '+ctx.label+': '+fmt(ctx.parsed)+' ('+(total?(ctx.parsed/total*100).toFixed(2):0)+'%)'}}}}});
  return inst;
}
// 결과를 표/막대/원형으로 토글해 보여준다(지표 조회·채팅·미리보기 공용).
function renderResult(node,r){
  node.innerHTML='';
  node.appendChild(el('pre','sql',esc(r.sql||'')));
  const rows=r.rows||[];
  if(!rows.length){node.appendChild(el('div','muted','결과 행이 없습니다.'));return;}
  const cols=Object.keys(rows[0]);
  const numCol=cols.find(c=>typeof rows[0][c]==='number');
  const labelCol=cols.find(c=>c!==numCol)||cols[0];
  const canChart=!!numCol && cols.length>=2 && rows.length<=50;

  const bar=el('div','vizbar');
  const content=el('div');content.style.marginTop='12px';
  let inst=null;  // 이 결과 블록 전용 차트 인스턴스
  function draw(kind){
    if(inst){inst.destroy();inst=null;}
    content.innerHTML='';
    [...bar.children].forEach(b=>b.classList.toggle('active',b.dataset.k===kind));
    if(kind==='table'){
      const tw=el('div','tablewrap');tw.appendChild(buildTable(rows));content.appendChild(tw);
      content.appendChild(el('div','tablecap','총 '+rows.length+'행'));return;
    }
    const labels=rows.map(x=>fmt(x[labelCol])), data=rows.map(x=>Number(x[numCol])||0);
    if(kind==='bar'){
      inst=drawBar(content,labels,data);
    }else{
      inst=drawDonut(content,labels,data);
    }
  }
  const views=[['table','표']];
  if(canChart){views.push(['bar','막대'],['pie','원형']);}
  views.forEach(([k,label])=>{const b=el('button','vizbtn',label);b.dataset.k=k;b.onclick=()=>draw(k);bar.appendChild(b);});
  node.append(bar,content);
  draw(canChart?'bar':'table');   // 기본: 차트 가능하면 막대, 아니면 표
}

  $('#progStatus').textContent='상태: '+s.job.status+' · '+(s.job.message||'');
  $('#progTables').innerHTML=s.tables.map(t=>{const mk=t.status==='done'?'<span class="ok">✓</span>':t.status==='failed'?'<span class="bad">✗</span>':t.status==='running'?'<span class="spin"></span>':'·';
    return '<div>'+mk+' '+esc(t.table_name)+' <span class="faint">'+(t.copied_rows||0)+(t.source_rows!=null?'/'+t.source_rows:'')+'</span>'+(t.error?' <span class="bad">'+esc(t.error)+'</span>':'')+'</div>';}).join('');
  if(s.job.status==='running'){pollT=setTimeout(poll,1200);}else{const f=s.tables.filter(t=>t.status==='failed').length;$('#retryNp').style.display=f?'':'none';await loadOrgs();}
}catch(e){$('#progStatus').innerHTML='<span class="err">'+esc(e.message)+'</span>';}}
$('#retryNp').onclick=async()=>{await api('/api/import/jobs/'+POLL+'/retry',{method:'POST'});$('#retryNp').style.display='none';poll();};

// close org menu on outside click
document.addEventListener('click',e=>{if(!e.target.closest('.orgbox'))$('#orgMenu').classList.remove('show');});

buildNav();loadOrgs();
</script>
</body>
</html>
